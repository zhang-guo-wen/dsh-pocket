name: Release

# 手动触发（Actions 页面 → Release → Run workflow）：
# push 只更新代码，本地测过没问题后再来这里手动发版（semantic-release
# 按自上次发版以来的提交自动定版本号，无需手动填）
on:
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # pnpm 版本由 package.json 的 packageManager 决定，action 从那读取。
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - name: Publish release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: pnpm run release
